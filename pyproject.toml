[build-system]
requires = ["setuptools>=77.0", "setuptools-scm>=8", "numpy>=1.24"]
build-backend = "setuptools.build_meta"

[project]
name = "arlmet"
dynamic = ["version"]  # from git tags, via setuptools-scm
description = "Read and write ARL meteorological files."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "James Mineau", email = "jameskmineau@gmail.com"}
]
keywords = ["arl", "hysplit", "meteorology", "atmospheric-science", "xarray"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyproj>=3.5",
    "typing_extensions>=4.0",
    "xarray>=2023.6",
]

[project.optional-dependencies]
archives = ["fsspec>=2024.2", "s3fs>=2024.2"]

[dependency-groups]
# Dev tooling and docs together; `uv sync` installs it by default.
dev = [
    "arlmet[archives]",
    "dask>=2023.6",  # lazy Datasets in the tests
    "docstr-coverage>=2.3",
    "git-cliff>=2.10",  # `just changelog`
    "pre-commit>=4.0",
    "pydata-sphinx-theme>=0.16",
    "pyrefly>=1.3",
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "ruff>=0.16",
    "rust-just>=1.42.4",
    "setuptools-scm>=8",  # `just version`
    "sphinx>=8.1",
    "sphinx-autobuild>=2024.10",  # `just docs-serve`
    "sphinx-autodoc-typehints>=3.0",
    "sphinx-copybutton>=0.5",
    "twine>=6.0",  # `just dist`
]

[project.entry-points."xarray.backends"]
arl = "arlmet.xarray._entrypoint:ARLBackendEntrypoint"

[project.urls]
Homepage = "https://github.com/jmineau/arl-met"
Documentation = "https://jmineau.github.io/arl-met/"
Repository = "https://github.com/jmineau/arl-met"
Issues = "https://github.com/jmineau/arl-met/issues"
Changelog = "https://github.com/jmineau/arl-met/blob/main/CHANGELOG.md"

[tool.coverage.run]
source = ["arlmet"]
branch = true

[tool.uv]
required-version = ">=0.12"
# Rebuild the editable install when the build config, the C packer or the git
# state changes, so `__version__` follows new commits and tags.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "src/arlmet/_pack.c" },
    { git = { commit = true, tags = true } },
]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "def __repr__",
]

[tool.pyrefly]
project-includes = ["src"]
preset = "strict"
python-version = "3.11"  # as CI checks, against the oldest supported Python

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
strict = true  # strict markers, config, xfail and parametrize ids
addopts = ["-ra"]
log_level = "INFO"  # show captured logs for failing tests
# Warnings are errors, so deprecations surface early. Ignore a specific
# third-party warning with e.g. "ignore:some message:DeprecationWarning:pkg".
filterwarnings = [
    "error",
    # numpy ignores this one itself (compiled packages such as netCDF4 raise it on
    # import); pytest's "error" filter would bring it back.
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]
markers = [
    "network: requires live network access to external services such as NOAA S3",
    "slow: expensive runtime, bandwidth, or disk usage; excluded from default test runs",
]

[tool.repo-review]
# Scientific Python repo-review (`uvx --from "sp-repo-review[cli]" sp-repo-review .`)
# checks that python-template skips on purpose:
ignore = [
    "PY007",  # task runner: just, not nox/tox
    "MY101",  # type checking is pyrefly's (strict preset here), not mypy's
    "PC110", "PC190",  # ruff runs as a local `uv run` hook, so uv.lock pins its version
    "PC140",  # pyrefly runs as a local `uv run` hook, so it sees the project's dependencies
    "PC160",  # no spell checker
    "PC180",  # no markdown formatter
    "PC901", "PC902", "PC903",  # pre-commit.ci is not used
]

[tool.ruff]
# target-version comes from project.requires-python

[tool.ruff.format]
docstring-code-format = true
# ruff also formats code blocks in Markdown; these keep their examples as written
# (e.g. hand-aligned comments).
exclude = ["README.md", "AGENTS.md"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",  # isort
    "D",  # pydocstyle, NumPy convention (below)
    "D213",  # docstring summary on the second line
    "NPY",  # NumPy-specific, incl. NumPy 2 deprecations
    "RUF100",  # unused noqa
]
ignore = [
    "E501",  # line too long, handled by formatter
    "D105",  # magic methods need no docstring (docstr-coverage skips them too)
    "D200",  # One-line docstring should fit on one line with quotes
    "D212",  # Multi-line docstring summary should start at the first line
    "D400",  # First line should end with a period, question mark, or exclamation point
]

[tool.ruff.lint.per-file-ignores]
# Tests need no docstrings, and a fixture's names what it provides ("A small
# grid."); the other docstring rules still apply to them.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D106", "D107", "D401"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["arlmet"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"arlmet" = ["py.typed"]

[tool.setuptools_scm]
# Releases are git tags vX.Y.Z (see RELEASING.md). Between releases the
# version is the next one as a dev version, e.g. 0.1.0b3.dev3+g1a2b3c4.
fallback_version = "0.0.0"  # no git metadata at all (e.g. a bare source copy)
