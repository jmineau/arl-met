name: Publish

# Pushing a vX.Y.Z tag (see `just release`) builds the wheels (cibuildwheel) and
# the sdist from that tag, publishes them to PyPI with trusted publishing, and
# creates a GitHub Release from the tag's CHANGELOG.md section. Zenodo archives
# each GitHub Release.
#
# Keep this file's name: the PyPI trusted publisher is registered for it.
on:
  push:
    tags: ["v*"]
  # Build (but never publish) wheels on PRs that touch the build, so a broken
  # wheel build is caught before a release tag is pushed.
  pull_request:
    paths:
      - "setup.py"
      - "pyproject.toml"
      - "src/arlmet/_pack.c"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # setuptools-scm reads the version from tags

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: "x86_64"
          # NumPy has no manylinux2014 wheels and needs GCC >= 10.3 to build
          # from source; manylinux_2_28 (glibc >= 2.28) matches NumPy's own
          # wheels. It is the cibuildwheel >= 3 default; pinned here explicitly.
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          # Smoke-test each wheel: the C packer must import and round-trip.
          CIBW_TEST_COMMAND: >-
            python -c "import numpy as np, arlmet;
            a = np.arange(400, dtype=np.float32).reshape(20, 20);
            packed, prec, exp, var1 = arlmet.pack(a);
            out = arlmet.unpack(packed.tobytes(), 20, 20, prec, exp, var1);
            assert np.allclose(out, a, atol=2 * prec), 'pack round-trip failed'"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # setuptools-scm reads the version from tags

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.14"

      - name: Build sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  check:
    name: Check distributions
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"

      - name: Check the metadata
        run: uvx twine check --strict dist/*

      # Each wheel computes its version in its own build (on Linux, inside a
      # container), so check all of them against the tag.
      - name: Check every version matches the tag
        run: |
          ls dist
          if [ "$GITHUB_REF_TYPE" != tag ]; then exit 0; fi
          version="${GITHUB_REF_NAME#v}"
          for f in dist/*; do
            case "$(basename "$f")" in
              "arlmet-$version-"*.whl | "arlmet-$version.tar.gz") ;;
              *) echo "::error::$f is not version $version"; exit 1 ;;
            esac
          done

  publish-pypi:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/arlmet
    permissions:
      id-token: write  # trusted publishing (OIDC); also signs attestations
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - name: Extract the CHANGELOG section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            /^## \[/ { if (found) exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "::error::CHANGELOG.md has no '## [$version]' section"; exit 1; }

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          # PEP 440 pre-releases (a, b, rc) and dev releases
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$|\.dev[0-9]+$ ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md "${prerelease[@]}"
